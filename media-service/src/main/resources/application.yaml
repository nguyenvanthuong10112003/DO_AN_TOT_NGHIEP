server:
  domain: http://localhost:8081
  port: 8081
  servlet:
    context-path: /e-learning/media-service/api/v1

spring:
  jackson:
    time-zone: Asia/Ho_Chi_Minh
  datasource:
    url: jdbc:mariadb://localhost:3306/media
    username: root
    password: namdinh1
    driver-class-name: org.mariadb.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    redis:
      host: localhost
      port: 6379
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

file:
  upload-dir: data/uploads/

redis:
  session:
    time-save: 3600 # seconds | 1 hour

apis:
  e-learning-service:
    name: e-learning-service
    base-url: http://localhost:8888/e-learning/api/v1

upload-photo:
  valid-duration: 86400 # 24 * 60 * 60 - seconds | 24 hours

rabbitmq:
  consume:
    retry-num: 10
  message-key:
    remove-photo: RABBITMQ_REMOVE_PHOTO_MESSAGE_KEY